services:
  - type: web
    name: webapp
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app_postgres:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: ENV
        value: prod
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: webapp-db
          property: connectionString
      - key: DB_POOL_MIN_SIZE
        value: "0"
      - key: DB_POOL_MAX_SIZE
        value: "4"
      - key: DB_POOL_TIMEOUT_SECONDS
        value: "20"
      - key: DB_POOL_MAX_IDLE_SECONDS
        value: "30"
      - key: DB_POOL_MAX_LIFETIME_SECONDS
        value: "900"
      - key: ENABLE_STARTUP_WARMUP
        value: "0"
      - key: ENABLE_RECEIPTS_ROUTES
        value: "0"

databases:
  - name: webapp-db
    plan: free
