<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; max-width: 420px; margin: 60px auto; padding: 0 16px; }
    .card { border: 1px solid #ddd; border-radius: 14px; padding: 18px; box-shadow: 0 6px 24px rgba(0,0,0,.06); }
    input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #ccc; font-size: 16px; margin-top: 10px; }
    button { margin-top: 12px; width: 100%; padding: 10px 12px; border-radius: 10px; border: 0; background: #111; color: #fff; font-size: 16px; }
    .small { margin-top: 10px; color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="margin:0 0 10px;">Login</h2>
    <form method="post" action="/login">
      <input name="secret" placeholder="Secret" autocomplete="off" />
      <button type="submit">Continue</button>
    </form>
    <div class="small">If you get sent here unexpectedly, refresh after logging in.</div>
  </div>
</body>
</html>
