<!doctype html>
<html lang="en">
<head>
  <script> window.BUILD_ID = "{{ BUILD_ID }}"; </script>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Finance" />

  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

  <link rel="stylesheet" href="/static/styles/tokens.css?v={{ BUILD_ID }}">
  <link rel="stylesheet" href="/static/styles/theme.css?v={{ BUILD_ID }}">
  <link rel="stylesheet" href="/static/css/base.css?v={{ BUILD_ID }}">
  <link rel="stylesheet" href="/static/styles/utilities.css?v={{ BUILD_ID }}">
  <link rel="stylesheet" href="/static/components/modal/modal.css?v={{ BUILD_ID }}">
  <link rel="stylesheet" href="/static/components/toast/toast.css?v={{ BUILD_ID }}">
  <link rel="stylesheet" href="/static/css/mobile.css?v={{ BUILD_ID }}">
  <link rel="stylesheet" href="/static/pages/account/account.css?v={{ BUILD_ID }}">

  <script src="/static/shared/theme.js?v={{ BUILD_ID }}"></script>
  <script src="/static/shared/globalLoading.js?v={{ BUILD_ID }}"></script>
  <script src="/static/shared/format.js?v={{ BUILD_ID }}"></script>
  <script src="/static/shared/dates.js?v={{ BUILD_ID }}"></script>
  <script src="/static/shared/shared.js?v={{ BUILD_ID }}" defer></script>
</head>

<body class="page-account" data-page-title="Account">
  <div class="page-container">
    <div id="chartMount" style="margin-top:14px;"></div>

    <hr class="section-divider" />
    <div id="upcomingMount" style="margin-top:14px;"></div>

    <hr class="section-divider" />
    <section aria-label="Transactions">
      <div class="category-box">
        <div class="category-box__header account-tx-header">
          <span>Transactions</span>
          <div class="account-tx-actions">
            <button id="accountAddTxBtn" type="button" class="account-tx-add-btn">Add Transaction</button>
            <button id="accountAuditBtn" type="button" class="account-tx-export-btn">Audit</button>
            <button id="accountVerifiedBtn" type="button" class="account-tx-export-btn">Verified</button>
            <button id="accountCsvExportBtn" type="button" class="account-tx-export-btn">Download Transactions CSV</button>
          </div>
        </div>
        <section id="accountAddTxPanel" class="account-addtx-panel" hidden>
          <div class="account-addtx-grid">
            <label>
              Date
              <input id="accountAddTxDate" type="date" />
            </label>
            <label class="account-addtx-status-field">
              Status
              <select id="accountAddTxStatus">
                <option value="posted">Posted</option>
                <option value="pending">Pending</option>
              </select>
            </label>
            <label>
              Amount
              <input id="accountAddTxAmount" type="number" step="0.01" placeholder="e.g. 24.99" />
            </label>
            <label class="account-addtx-merchant-field">
              Merchant
              <input id="accountAddTxMerchant" type="text" placeholder="e.g. Starbucks" />
            </label>
          </div>
          <div class="account-addtx-help">Use positive for spending and negative for deposits/refunds.</div>
          <div class="account-addtx-actions">
            <button id="accountAddTxSaveBtn" type="button" class="settings-btn small">Save</button>
            <button id="accountAddTxCancelBtn" type="button" class="settings-btn small">Cancel</button>
            <div id="accountAddTxMsg" class="account-addtx-msg"></div>
          </div>
        </section>
        <div id="txList" class="tx-list"></div>
      </div>
    </section>
  </div>

  <div id="sharedChrome"></div>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/static/sw.js").catch(console.error);
    }
  </script>
  <script src="/static/components/modal/txInspect.js?v={{ BUILD_ID }}"></script>
  <script src="/static/shared/category_icons.js?v={{ BUILD_ID }}"></script>
  <script src="/static/shared/profile.js?v={{ BUILD_ID }}"></script>
  <script src="/static/components/cards/chartControls.js?v={{ BUILD_ID }}"></script>
  <script src="/static/components/cards/chartCard.js?v={{ BUILD_ID }}&rev=20260414b"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="/static/pages/account/account.js?v={{ BUILD_ID }}"></script>
</body>
</html>
