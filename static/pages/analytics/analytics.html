<!doctype html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>Analytics</title>
  <link rel="stylesheet" href="/static/styles/tokens.css?v=analytics-20260519a">
  <link rel="stylesheet" href="/static/styles/theme.css?v=analytics-20260519a">
  <link rel="stylesheet" href="/static/css/base.css?v=analytics-20260519a">
  <link rel="stylesheet" href="/static/styles/utilities.css?v=analytics-20260519a">
  <link rel="stylesheet" href="/static/css/mobile.css?v=analytics-20260519a">
  <link rel="stylesheet" href="/static/pages/analytics/analytics.css?v=analytics-20260519a">

<body class="analytics-page" data-page-title="Analytics">
  <div class="analytics-wrap">
    <section class="analytics-hero">
      <div class="analytics-hero__month" id="heroMonth">Monthly Report</div>
      <div class="analytics-hero__net" id="heroNet">$0.00</div>
      <div class="analytics-hero__chips" id="heroChips"></div>
    </section>

    <section class="analytics-toolbar no-print">
      <div class="analytics-toolbar__left">
        <label for="reportMonth">Month</label>
        <input id="reportMonth" type="month" />
        <button id="reportRefreshBtn" type="button" class="settings-btn primary">Load Report</button>
      </div>
      <button id="reportDownloadPdfBtn" type="button" class="settings-btn">Download PDF</button>
    </section>

    <div id="reportStatus" class="settings-muted" role="status" aria-live="polite"></div>

    <section class="analytics-card"><h2>Month Summary</h2><div id="summaryGrid"></div></section>
    <section class="analytics-card"><h2>Category Breakdown</h2><div id="categoryBreakdown"></div></section>
    <section class="analytics-card"><h2>Savings Accounts</h2><div id="savingsSummary"></div></section>
    <section class="analytics-card"><h2>Liquid Accounts</h2><div id="liquidSummary"></div></section>
    <section class="analytics-card"><h2>Debt Accounts</h2><div id="debtSummary"></div></section>
    <section class="analytics-card"><h2>Biggest Transactions</h2><div id="biggestTransactions"></div></section>
    <section class="analytics-card"><h2>Recurring & Subscriptions</h2><div id="recurringHits"></div></section>
    <section class="analytics-card"><h2>Budget Performance</h2><div id="budgetPerformance"></div></section>
    <section class="analytics-card"><h2>Changes vs Previous Month</h2><div id="changesVsPrev"></div></section>
  </div>

  <div id="sharedChrome"></div>
  <script src="/static/shared/shared.js?v=analytics-20260519a" defer></script>
  <script type="module" src="/static/pages/analytics/report-page.js?v=report-20260523a"></script>
  <script>
    (function () {
      function retryImport() {
        if (window.__analyticsBootRan) return;
        import("/static/pages/analytics/report-page.js?v=report-20260523a&retry=" + Date.now()).catch(function (err) {
          console.error("analytics retry import failed", err);
        });
      }
      if (document.readyState === "complete" || document.readyState === "interactive") {
        setTimeout(retryImport, 50);
      }
      window.addEventListener("DOMContentLoaded", function () { setTimeout(retryImport, 100); }, { once: true });
      window.addEventListener("load", function () { setTimeout(retryImport, 150); }, { once: true });
      window.addEventListener("pageshow", function () { setTimeout(retryImport, 50); });
    })();
  </script>
</body>
</html>
