<!doctype html>
<html lang="en">
<head>
  <script> window.BUILD_ID = "{{ BUILD_ID }}"; </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>Category Rules</title>

  <link rel="stylesheet" href="/static/styles/tokens.css?v={{ BUILD_ID }}">
  <link rel="stylesheet" href="/static/styles/theme.css?v={{ BUILD_ID }}">
  <link rel="stylesheet" href="/static/css/base.css?v={{ BUILD_ID }}">
  <link rel="stylesheet" href="/static/styles/utilities.css?v={{ BUILD_ID }}">
  <link rel="stylesheet" href="/static/components/modal/modal.css?v={{ BUILD_ID }}">
  <link rel="stylesheet" href="/static/components/toast/toast.css?v={{ BUILD_ID }}">
  <link rel="stylesheet" href="/static/css/mobile.css?v={{ BUILD_ID }}">
  <link rel="stylesheet" href="/static/pages/category-rules/category-rules.css?v={{ BUILD_ID }}">

  <script src="/static/shared/theme.js?v={{ BUILD_ID }}"></script>
  <script src="/static/shared/globalLoading.js?v={{ BUILD_ID }}"></script>
</head>

<body class="page-category-rules" data-page-title="Category Rules">
  <div class="settings-wrap">
    <section class="settings-section">
      <div class="settings-section-head">
        <h2 class="settings-section-title">Regex Rules</h2>
        <div class="settings-muted" style="margin:0;">Edit categories, disable/delete rules, test regex, and re-apply to existing transactions.</div>
      </div>

      <div class="settings-card">
        <div class="rules-toolbar">
          <button id="refreshRulesBtn" class="settings-btn small">Refresh</button>
          <input id="ruleSearchId" class="settings-input mono" style="max-width:120px;" placeholder="Rule ID" />
          <input id="ruleSearchKeyword" class="settings-input" style="max-width:240px;" placeholder="Keywords / regex" />
          <input id="ruleSearchCategory" class="settings-input" style="max-width:180px;" placeholder="Category" />
          <span id="rulesStatus" class="settings-muted" style="margin:0;"></span>
        </div>
        <div id="rulesCards" class="rules-cards" hidden></div>

        <table class="settings-table rules-table" id="rulesTable">
          <thead>
            <tr>
              <th style="width:44%;">Regex</th>
              <th style="width:24%;">Category</th>
              <th style="width:10%;">Matches</th>
              <th style="width:10%;">Active</th>
              <th style="width:12%;">Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>

        <div style="display:flex; justify-content:center; margin-top:12px;">
          <button id="rulesLoadMoreBtn" class="settings-btn small" hidden>Load more</button>
        </div>

        <datalist id="categoryOptions"></datalist>
      </div>
    </section>
  </div>

  <div id="ruleTestModal" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-head">
        <div>
          <div class="modal-title">Test Regex</div>
          <div id="testSubtitle" class="settings-muted" style="margin:4px 0 0 0;"></div>
        </div>
        <button id="closeTestModal" class="settings-btn small">Close</button>
      </div>
      <div class="modal-body">
        <div class="settings-row" style="align-items:flex-end;">
          <label style="display:flex; flex-direction:column; gap:6px; font-weight:800; font-size:12px; opacity:.85; flex:1;">
            Regex
            <input id="testPattern" class="settings-input mono" placeholder="your regex..." />
          </label>
          <label style="display:flex; flex-direction:column; gap:6px; font-weight:800; font-size:12px; opacity:.85; width:120px;">
            Flags
            <input id="testFlags" class="settings-input mono" value="i" />
          </label>
          <label style="display:flex; flex-direction:column; gap:6px; font-weight:800; font-size:12px; opacity:.85; width:120px;">
            Recent limit
            <input id="testLimit" class="settings-input mono" value="50" />
          </label>
          <button id="runTestBtn" class="settings-btn">Run test</button>
        </div>

        <div id="testResults" class="test-results"></div>
      </div>
    </div>
  </div>

  <div id="sharedChrome"></div>

  <script src="/static/pages/category-rules/category-rules.js?v={{ BUILD_ID }}"></script>
  <script src="/static/shared/shared.js?v={{ BUILD_ID }}" defer></script>
</body>
</html>
