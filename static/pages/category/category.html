<!doctype html>
<html lang="en">
<head>
  <script> window.BUILD_ID = "{{ BUILD_ID }}"; </script>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Finance" />

  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>

  <link rel="stylesheet" href="/static/styles/tokens.css?v={{ BUILD_ID }}">
  <link rel="stylesheet" href="/static/styles/theme.css?v={{ BUILD_ID }}">
  <link rel="stylesheet" href="/static/css/base.css?v={{ BUILD_ID }}">
  <link rel="stylesheet" href="/static/styles/utilities.css?v={{ BUILD_ID }}">
  <link rel="stylesheet" href="/static/components/modal/modal.css?v={{ BUILD_ID }}">
  <link rel="stylesheet" href="/static/components/toast/toast.css?v={{ BUILD_ID }}">
  <link rel="stylesheet" href="/static/css/mobile.css?v={{ BUILD_ID }}">
  <link rel="stylesheet" href="/static/pages/category/category.css?v={{ BUILD_ID }}">

  <script src="/static/shared/theme.js?v={{ BUILD_ID }}"></script>
  <script src="/static/shared/globalLoading.js?v={{ BUILD_ID }}"></script>
</head>
<body class="page-categories">
  <div class="page-container">
    <div class="cat-layout">
      <main class="cat-main">
        <div id="chartMount"></div>
        <section aria-label="Transactions" style="margin-top:18px;">
          <div class="category-box">
            <div class="category-box__header">Transactions</div>
            <div id="catTxList" class="tx-list"></div>
          </div>
        </section>
      </main>
    </div>

    <div id="catDrawerBackdrop" class="cat-drawer-backdrop" aria-hidden="true"></div>

    <aside id="catDrawer" class="cat-drawer" aria-label="All Categories">
      <div class="cat-drawer__title">All Categories (Lifetime)</div>
      <table class="cat-side-table" id="catSideTable">
        <thead>
          <tr><th>Category</th><th style="text-align:right;">Total</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </aside>

    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/static/sw.js").catch(console.error);
      }
    </script>
    <div id="sharedChrome"></div>

    <script src="/static/shared/category_icons.js?v={{ BUILD_ID }}"></script>
    <script src="/static/components/modal/txInspect.js?v={{ BUILD_ID }}"></script>
    <script src="/static/shared/profile.js?v={{ BUILD_ID }}"></script>
    <script src="/static/shared/dates.js?v={{ BUILD_ID }}"></script>
    <script src="/static/components/cards/chartControls.js?v={{ BUILD_ID }}"></script>
    <script src="/static/components/cards/chartCard.js?v={{ BUILD_ID }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/shared/format.js?v={{ BUILD_ID }}"></script>
    <script type="module" src="/static/pages/category/category.js?v={{ BUILD_ID }}"></script>
    <script src="/static/shared/shared.js?v={{ BUILD_ID }}" defer></script>
  </div>
</body>
</html>
