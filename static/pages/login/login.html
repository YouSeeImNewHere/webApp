<!doctype html>
<html lang="en">
<head>
  <script> window.BUILD_ID = "{{ BUILD_ID }}"; </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <link rel="stylesheet" href="/static/styles/tokens.css?v={{ BUILD_ID }}">
  <link rel="stylesheet" href="/static/styles/theme.css?v={{ BUILD_ID }}">
  <link rel="stylesheet" href="/static/css/base.css?v={{ BUILD_ID }}">
  <link rel="stylesheet" href="/static/styles/utilities.css?v={{ BUILD_ID }}">
  <link rel="stylesheet" href="/static/pages/login/login.css?v={{ BUILD_ID }}">
  <script src="/static/shared/theme.js?v={{ BUILD_ID }}"></script>
</head>
<body class="login-page">
  <div class="login-card">
    <h2 style="margin:0 0 10px;">Login</h2>
    <form method="post" action="/login">
      <input name="secret" placeholder="Secret" autocomplete="off" />
      <button type="submit">Continue</button>
    </form>
    <div class="login-small">If you get sent here unexpectedly, refresh after logging in.</div>
  </div>

  <script src="/static/pages/login/login.js?v={{ BUILD_ID }}"></script>
</body>
</html>
