<!-- Top bar -->
<div id="topBar">
  <header class="top-bar">
    <div class="top-bar-inner">
      <a class="top-btn" href="/settings" aria-label="Settings">&#9881;&#65039;</a>
      <div class="top-title" id="topBarTitle">Page</div>
      <div class="top-bar-right">
        <button class="top-btn notif-btn" id="topBarNotif" type="button" aria-label="Notifications">
          &#128276;
          <span class="notif-badge hidden" id="topBarNotifBadge">0</span>
        </button>
      </div>
    </div>
    <div class="overlay hidden" id="notifOverlay" aria-hidden="true"></div>
    <aside class="side-panel hidden" id="notifPanel" aria-hidden="true" aria-label="Notifications panel">
      <div class="panel-header">
        <div>
          <div class="panel-title">Notifications</div>
          <div class="panel-subtitle" id="notifSubtitle"></div>
        </div>
        <button class="top-btn" id="notifCloseBtn" type="button" aria-label="Close">&#10005;</button>
      </div>
      <div class="notif-tabs" id="notifTabs" role="tablist" aria-label="Notification tabs">
        <button class="notif-tab is-active" id="notifTabGeneral" type="button" role="tab" aria-selected="true">General</button>
        <button class="notif-tab hidden" id="notifTabErrors" type="button" role="tab" aria-selected="false">
          Errors
          <span class="notif-tab-count hidden" id="notifErrorsCount">0</span>
        </button>
      </div>
      <div class="panel-actions">
        <button class="settings-btn primary" id="notifRefreshBtn" type="button">Refresh</button>
        <button class="settings-btn" id="notifMarkAllReadBtn" type="button">Mark all read</button>
        <button class="settings-btn" id="notifClearReadBtn" type="button">Clear read</button>
        <button class="settings-btn hidden" id="notifWhatsNewBtn" type="button">What's New</button>
        <button class="settings-btn hidden" id="notifClearErrorsBtn" type="button">Clear errors</button>
      </div>
      <div class="panel-body">
        <div class="notif-split">
          <div class="notif-list" id="notifList"></div>
          <div class="notif-detail hidden" id="notifDetail">
            <div class="notif-detail-head">
              <div class="notif-detail-sub" id="notifDetailMeta"></div>
              <div class="notif-detail-title" id="notifDetailTitle"></div>
            </div>
            <pre class="notif-detail-body" id="notifDetailBody"></pre>
            <div class="notif-detail-actions">
              <button class="btn" id="notifDismissBtn" type="button">Dismiss</button>
            </div>
          </div>
        </div>
      </div>
    </aside>
  </header>
</div>

<!-- Bottom tabs -->
<div id="bottomTabs">
  <nav class="mobile-tabs" aria-label="Bottom Tabs">
    <a class="mobile-tab" href="/" data-tab="home">
      <span class="tab-ico">&#127968;</span>
      <span>Home</span>
    </a>
    <a class="mobile-tab" href="/static/pages/spending/spending.html" data-tab="spending">
      <span class="tab-ico">&#128184;</span>
      <span>Spending</span>
    </a>
    <a class="mobile-tab" href="/static/pages/all-transactions/all-transactions.html" data-tab="all">
      <span class="tab-ico">&#128270;</span>
      <span>All</span>
    </a>
    <a class="mobile-tab" href="/static/pages/recurring/recurring.html" data-tab="recurring">
      <span class="tab-ico">&#128257;</span>
      <span>Recurring</span>
    </a>
    <a class="mobile-tab" href="/static/pages/receipts/receipts.html" data-tab="receipts">
      <span class="tab-ico">&#129534;</span>
      <span>Receipts</span>
    </a>
  </nav>
</div>

<!-- Notification modal (popup detail) -->
<div id="notifModal" class="notif-modal hidden" aria-hidden="true">
  <div class="notif-modal-card" role="dialog" aria-modal="true" aria-label="Notification">
    <div class="notif-modal-header">
      <div id="notifModalTitle" class="notif-modal-title"></div>
      <button id="notifModalClose" class="icon-btn" type="button" aria-label="Close">&#10005;</button>
    </div>
    <div id="notifModalMeta" class="notif-modal-meta"></div>
    <div id="notifModalBody" class="notif-modal-body"></div>
    <div class="notif-modal-actions">
      <button id="notifModalDismiss" class="settings-btn danger" type="button">Dismiss</button>
      <button id="notifModalOk" class="settings-btn primary" type="button">Close</button>
    </div>
  </div>
</div>
